# =============================================================================
# Application
# =============================================================================

[tool.poe.groups.application]
heading = "Application"

[tool.poe.groups.application.tasks.serve]
help = "Run the FastAPI app locally. No auto-reload: on Windows, uvicorn's --reload supervisor forces WindowsSelectorEventLoopPolicy, which breaks Playwright's subprocess-based browser launch on startup."
cmd = "uvicorn app.main:app"

[tool.poe.groups.application.tasks.load-draws]
help = "Scrape and save a draw for any of Miloto/Baloto/Revancha via the running API. Pass only the games you want, e.g. --miloto 913."
cmd = "python -m scripts.load_draws"

# =============================================================================
# Testing
# =============================================================================

[tool.poe.groups.testing]
heading = "Testing"

[tool.poe.groups.testing.tasks.test]
help = "Run the complete backend test suite."
cmd = "pytest"

[tool.poe.groups.testing.tasks.test-xvv]
help = "Run the complete backend test suite."
cmd = "pytest -x -vv"

[tool.poe.groups.testing.tasks.testcov]
help = "Run tests and generate terminal and HTML coverage reports."
cmd = "pytest --cov=app --cov-report=term-missing --cov-report=html"

[tool.poe.groups.testing.tasks.test-perf]
help = "Run a test path in verbose mode and report the slowest test durations."
cmd = "pytest ${path} -x -vv --durations=${durations}"

[[tool.poe.groups.testing.tasks.test-perf.args]]
name = "path"
options = ["--path"]
default = "tests/unit/utils/page_tests/tests_pages.py"
help = "Test file or directory to execute."

[[tool.poe.groups.testing.tasks.test-perf.args]]
name = "durations"
options = ["--durations"]
type = "integer"
default = 10
help = "Number of slowest test durations to report."

[tool.poe.groups.testing.tasks.test-game-selection]
help = "Validate the pytest game-selection infrastructure in isolation."
cmd = "pytest tests/unit/utils/page_tests/infra/game_selection.py -x"

# =============================================================================
# Database
# =============================================================================

[tool.poe.groups.database]
heading = "Database"

[tool.poe.groups.database.tasks.db-upgrade]
help = "Apply all pending Alembic migrations to the configured database."
cmd = "alembic upgrade head"

[tool.poe.groups.database.tasks.db-downgrade]
help = "Revert the most recently applied Alembic migration."
cmd = "alembic downgrade -1"

[tool.poe.groups.database.tasks.db-revision]
help = "Autogenerate a new Alembic revision from ORM model changes."
cmd = "alembic revision --autogenerate -m \"${message}\""

[[tool.poe.groups.database.tasks.db-revision.args]]
name = "message"
options = ["--message", "-m"]
help = "Short description of the schema change."

# =============================================================================
# Code Quality
# =============================================================================

[tool.poe.groups.quality]
heading = "Code Quality"

[tool.poe.groups.quality.tasks.lint]
help = "Lint application and test code, excluding deferred documentation checks."
cmd = "ruff check app tests alembic scripts --ignore D100,D101,D102"

[tool.poe.groups.quality.tasks.lint-fix]
help = "Apply safe Ruff fixes, excluding deferred documentation checks."
cmd = "ruff check app tests alembic scripts --ignore D100,D101,D102 --fix"

[tool.poe.groups.quality.tasks.lint-fix-all]
help = "Apply all safe Ruff fixes to application and test code."
cmd = "ruff check app tests alembic scripts --fix"

[tool.poe.groups.quality.tasks.lint-docs]
help = "Check deferred module, class, and method documentation."
cmd = "ruff check app tests alembic scripts --select D100,D101,D102"

[tool.poe.groups.quality.tasks.format]
help = "Format application and test code."
cmd = "ruff format app tests alembic scripts"

[tool.poe.groups.quality.tasks.format-check]
help = "Verify formatting without modifying files."
cmd = "ruff format --check app tests alembic scripts"

[tool.poe.groups.quality.tasks.typecheck]
help = "Run strict static type checking."
cmd = "pyright"


# =============================================================================
# Quality Workflows
# =============================================================================

[tool.poe.groups.workflows]
heading = "Quality Workflows"

[tool.poe.groups.workflows.tasks.check-fast]
help = "Run static checks and verify that unit tests can be collected."
sequence = [
    { cmd = "ruff format --check app tests alembic scripts" },
    { cmd = "ruff check app tests alembic scripts" },
    { cmd = "pyright app tests alembic scripts" },
    { cmd = "pytest tests/unit --collect-only -q" },
]

[tool.poe.groups.workflows.tasks.check]
help = "Run the required backend quality checks."
sequence = [
    "format-check",
    "lint",
    "typecheck",
    "test",
]

[tool.poe.groups.workflows.tasks.check-all]
help = "Run all checks, including documentation."
sequence = [
    "format-check",
    "lint",
    "lint-docs",
    "typecheck",
    "test",
]